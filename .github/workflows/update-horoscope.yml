name: Update Horoscope

on:
  schedule:
    # 22:00 UTC = 06:00 Taiwan time (UTC+8)
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and translate today's horoscopes
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: node scripts/update-horoscope.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add horoscope.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily horoscope"
            git push
          fi
